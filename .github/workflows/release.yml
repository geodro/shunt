name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches shunt/__init__.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' shunt/__init__.py)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$source_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME vs __version__ $source_version — bump one of them" >&2
            exit 1
          fi

  deb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/build-deb.sh
      - name: Contents are where they should be
        run: dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Build deps
        run: dnf -y install git rpm-build
      - uses: actions/checkout@v4
      - run: bash packaging/build-rpm.sh
      - name: Contents and dependencies are where they should be
        run: |
          rpm -qlp dist/*.rpm
          rpm -qp --requires dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  publish:
    needs: [deb, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
