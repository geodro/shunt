<?xml version="1.0" encoding="UTF-8"?>
<!-- Iconița de tray. Foaia de stil cu id-ul current-color-scheme e convenția
     Breeze: Plasma o rescrie la încărcare, deci .ColorScheme-Text urmează
     culoarea panoului, adică deschis pe panou închis și invers. Fără accent
     aici, dinadins. Merge doar când iconița e cerută după nume din temă.

     Drumul nealeas stă la 38% opacitate: într-o singură culoare ierarhia se
     ține prin greutate, altfel desenul arată ca un simplu Y. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text { color: #232629; }
    </style>
  </defs>
  <g class="ColorScheme-Text" fill="none" stroke="currentColor"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21.5 V14" stroke-width="2.6" opacity=".38"/>
    <path d="M12 14 C 12 10.8 9.2 8 5.6 4.9" stroke-width="1.9" opacity=".38"/>
    <path d="M12 14 C 12 10.8 14.8 8 18.4 4.9" stroke-width="2.6"/>
  </g>
  <rect class="ColorScheme-Text" x="9.6" y="16.1" width="4.8" height="4.8" rx="1"
        transform="rotate(45 12 18.5)" fill="currentColor"/>
</svg>
